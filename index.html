<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6f7fb"><title>Task Manager — Focus on what matters</title>
<style>
:root{color-scheme:light;--bg:#f6f7fb;--panel:#fff;--ink:#20243a;--muted:#7b8098;--line:#e8eaf2;--accent:#6558e8;--soft:#eeecff;--green:#238b68;--red:#d94b65;--shadow:0 10px 35px #20243a0a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;transition:background .2s,color .2s}body.dark{color-scheme:dark;--bg:#141522;--panel:#1d1f30;--ink:#f3f3fc;--muted:#a1a5bd;--line:#303248;--accent:#a39aff;--soft:#302c50;--green:#62d6a8;--red:#ff8297;--shadow:0 10px 35px #0002}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9c94ff;outline-offset:2px}.app{max-width:1180px;margin:auto;padding:30px 24px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:12px}.logo{width:43px;height:43px;border-radius:14px;background:var(--accent);color:white;display:grid;place-items:center;font-size:22px;box-shadow:0 7px 18px #6558e83b}.brand h1{font-size:21px;line-height:1.2;margin:0;letter-spacing:-.6px}.brand p{margin:4px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:11px;font-weight:600;transition:transform .15s,box-shadow .15s}.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);gap:24px}.side,.main{min-width:0}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.side .card{padding:20px;margin-bottom:16px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;font-weight:800;color:var(--muted);margin:0 0 15px}.nav{display:grid;gap:5px}.nav button{display:flex;align-items:center;justify-content:space-between;border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:10px;text-align:left}.nav button.active,.nav button:hover{background:var(--soft);color:var(--accent);font-weight:700}.count{font-size:11px;background:var(--bg);padding:2px 7px;border-radius:7px}.goal-head{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:13px;margin:14px 0 7px}.track{height:7px;background:var(--line);border-radius:20px;overflow:hidden}.fill{height:100%;background:var(--accent);border-radius:20px;transition:width .3s}.goal-edit{display:flex;gap:7px;margin-top:15px}.goal-edit input{min-width:0;width:50%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px}.main-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 0 20px}.main-head h2{margin:0;font-size:25px;letter-spacing:-.7px}.sub{color:var(--muted);font-size:13px;margin-top:5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{padding:16px 18px}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:25px;margin-top:5px;letter-spacing:-.5px}.composer{padding:12px;display:flex;gap:9px;margin-bottom:16px}.composer input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--ink);padding:8px}.toolbar{display:flex;gap:9px;margin-bottom:14px}.toolbar input,.toolbar select{min-width:0;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}.toolbar input{flex:1}.task-list{display:grid;gap:10px}.task{display:flex;align-items:flex-start;gap:12px;padding:16px;animation:rise .2s ease both}.check{appearance:none;flex:none;width:19px;height:19px;border:1.7px solid #b9bdd0;border-radius:6px;margin:2px 0 0;cursor:pointer;display:grid;place-items:center}.check:checked{background:var(--green);border-color:var(--green)}.check:checked:after{content:'✓';color:white;font-size:13px;font-weight:800}.task-content{flex:1;min-width:0}.task-title{font-weight:650;overflow-wrap:anywhere}.task.done .task-title{text-decoration:line-through;color:var(--muted)}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;color:var(--muted);font-size:11px}.pill{border-radius:6px;padding:3px 7px;background:var(--bg)}.pill.high{color:var(--red);background:color-mix(in srgb,var(--red) 10%,transparent)}.pill.medium{color:#c48a26;background:#c48a2617}.pill.overdue{color:var(--red)}.task-actions{display:flex;gap:5px}.iconbtn{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:6px 8px}.iconbtn:hover{background:var(--bg);color:var(--ink)}.empty{padding:48px 20px;text-align:center;color:var(--muted)}.empty .emoji{font-size:30px;margin-bottom:10px}.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}.hint{font-size:12px;color:var(--muted);margin-top:18px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:11px 16px;border-radius:12px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(max-width:760px){.app{padding:18px 14px 40px}.layout{grid-template-columns:1fr;gap:14px}.side{display:grid;grid-template-columns:1fr 1fr;gap:12px}.side .card{margin:0;padding:15px}.nav{grid-template-columns:1fr 1fr}.nav button{padding:9px}.main-head h2{font-size:22px}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:22px}.top{margin-bottom:20px}.brand p{display:none}}@media(max-width:460px){.side{grid-template-columns:1fr}.top-actions .label{display:none}.btn{padding:10px 12px}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat span{font-size:10px}.stat strong{font-size:20px}.toolbar{flex-wrap:wrap}.toolbar input{flex-basis:100%}.task{padding:13px}.task-actions{gap:0}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><div class="logo">✓</div><div><h1>Task Manager</h1><p>A little progress, every day.</p></div></div><div class="top-actions"><button class="btn" id="theme" aria-label="Toggle theme">◐ <span class="label">Theme</span></button><button class="btn primary" id="focus">Focus mode</button></div></header>
<div class="layout"><aside class="side"><section class="card"><p class="eyebrow">Workspace</p><nav class="nav" id="nav"><button class="active" data-filter="all">All tasks <span class="count" id="n-all">0</span></button><button data-filter="active">In progress <span class="count" id="n-active">0</span></button><button data-filter="completed">Completed <span class="count" id="n-completed">0</span></button><button data-filter="today">Due today <span class="count" id="n-today">0</span></button></nav></section>
<section class="card"><p class="eyebrow">Your goals</p><div class="goal-head"><span>Weekly focus</span><span id="week-label">0 / 5</span></div><div class="track"><div class="fill" id="week-fill" style="width:0"></div></div><div class="goal-head"><span>Monthly focus</span><span id="month-label">0 / 20</span></div><div class="track"><div class="fill" id="month-fill" style="width:0"></div></div><div class="goal-edit"><input id="week-goal" type="number" min="1" max="100" value="5" aria-label="Weekly goal"><input id="month-goal" type="number" min="1" max="500" value="20" aria-label="Monthly goal"><button class="btn" id="save-goals">Save</button></div><p class="sub">Set weekly and monthly completion targets.</p></section></aside>
<main class="main"><div class="main-head"><div><h2 id="view-title">All tasks</h2><div class="sub" id="date-line"></div></div><button class="btn" id="clear-done">Clear completed</button></div>
<div class="stats"><section class="card stat"><span>Total tasks</span><strong id="total">0</strong></section><section class="card stat"><span>Completed</span><strong id="done-total">0</strong></section><section class="card stat"><span>Completion</span><strong id="rate">0%</strong></section></div>
<form class="card composer" id="form"><input id="new-title" placeholder="Add a task and press Enter…" maxlength="180" required aria-label="New task title"><button class="btn primary" type="submit">＋ Add task</button></form>
<div class="toolbar"><input id="search" placeholder="Search tasks or tags…" aria-label="Search tasks"><select id="sort" aria-label="Sort tasks"><option value="created">Recently added</option><option value="due">Due date</option><option value="priority">Priority</option></select><select id="priority-filter" aria-label="Filter priority"><option value="all">Any priority</option><option value="high">High priority</option><option value="medium">Medium priority</option><option value="low">Low priority</option></select></div>
<div class="task-list" id="tasks"></div><p class="hint">Keyboard: <b>N</b> new task · <b>/</b> search · <b>Esc</b> clear search</p></main></div></div><div class="toast" id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id), today=()=>new Date().toISOString().slice(0,10), dayStart=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
let tasks=[],filter='all',focusMode=false,toastTimer;
try{tasks=JSON.parse(localStorage.getItem('tm-tasks-v1')||'[]');if(!Array.isArray(tasks))tasks=[]}catch{tasks=[]}
let goals={week:5,month:20};try{goals={...goals,...JSON.parse(localStorage.getItem('tm-goals-v1')||'{}')}}catch{}
$('week-goal').value=goals.week;$('month-goal').value=goals.month;
function save(){localStorage.setItem('tm-tasks-v1',JSON.stringify(tasks));render()}
function notify(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2100)}
function escaped(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function add(title){title=title.trim();if(!title)return;let due='';const m=title.match(/\s+(today|tomorrow|next week|in \d+ days?)$/i);if(m){let d=new Date();if(/^tomorrow$/i.test(m[1]))d.setDate(d.getDate()+1);else if(/^next week$/i.test(m[1]))d.setDate(d.getDate()+7);else if(/^in /i.test(m[1]))d.setDate(d.getDate()+parseInt(m[1].match(/\d+/)[0]));due=d.toISOString().slice(0,10);title=title.slice(0,m.index).trim()}tasks.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,done:false,priority:'medium',due,tags:[],created:Date.now(),completedAt:null});save();notify('Task added')}
function visible(){let q=$('search').value.toLowerCase().trim();return tasks.filter(t=>(filter==='all'||(filter==='active'&&!t.done)||(filter==='completed'&&t.done)||(filter==='today'&&t.due===today()&&!t.done))&&(!focusMode||!t.done)&&(!q||(t.title+' '+t.tags.join(' ')).toLowerCase().includes(q))&&($('priority-filter').value==='all'||t.priority===$('priority-filter').value)).sort((a,b)=>$('sort').value==='due'?(a.due||'9999').localeCompare(b.due||'9999'): $('sort').value==='priority'?({high:0,medium:1,low:2}[a.priority]-{high:0,medium:1,low:2}[b.priority]):b.created-a.created)}
function render(){let done=tasks.filter(t=>t.done).length; $('n-all').textContent=tasks.length;$('n-active').textContent=tasks.length-done;$('n-completed').textContent=done;$('n-today').textContent=tasks.filter(t=>t.due===today()&&!t.done).length;$('total').textContent=tasks.length;$('done-total').textContent=done;$('rate').textContent=(tasks.length?Math.round(done/tasks.length*100):0)+'%';let now=new Date(),weekStart=new Date(now);weekStart.setDate(now.getDate()-((now.getDay()+6)%7));weekStart.setHours(0,0,0,0);let monthStart=new Date(now.getFullYear(),now.getMonth(),1);let wc=tasks.filter(t=>t.done&&t.completedAt>=weekStart.getTime()).length,mc=tasks.filter(t=>t.done&&t.completedAt>=monthStart.getTime()).length;$('week-label').textContent=wc+' / '+goals.week;$('month-label').textContent=mc+' / '+goals.month;$('week-fill').style.width=Math.min(100,wc/goals.week*100)+'%';$('month-fill').style.width=Math.min(100,mc/goals.month*100)+'%';$('date-line').textContent=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(now);
$('view-title').textContent=focusMode?'Focus mode':({all:'All tasks',active:'In progress',completed:'Completed',today:'Due today'}[filter]);
let list=visible();$('tasks').innerHTML=list.length?list.map(t=>'<article class="card task '+(t.done?'done':'')+'"><input class="check" type="checkbox" data-action="toggle" data-id="'+t.id+'" '+(t.done?'checked':'')+' aria-label="Mark task complete"><div class="task-content"><div class="task-title" data-action="edit" data-id="'+t.id+'" title="Click to edit">'+escaped(t.title)+'</div><div class="meta"><span class="pill '+t.priority+'">'+t.priority+' priority</span>'+(t.due?'<span class="pill '+(!t.done&&t.due<today()?'overdue':'')+'">'+(t.due<today()&&!t.done?'Overdue · ':'Due ')+escaped(t.due)+'</span>':'')+(t.tags||[]).map(tag=>'<span class="pill">#'+escaped(tag)+'</span>').join('')+'</div></div><div class="task-actions"><button class="iconbtn" data-action="details" data-id="'+t.id+'" aria-label="Edit task details" title="Edit details">⋯</button><button class="iconbtn" data-action="delete" data-id="'+t.id+'" aria-label="Delete task" title="Delete">×</button></div></article>').join():'<section class="card empty"><div class="emoji">✦</div><strong>'+(tasks.length?'No matching tasks':'A clear space to start')+'</strong><span>'+(tasks.length?'Try another filter or search.':'Add your first task above and build momentum.')+'</span></section>'}
$('form').addEventListener('submit',e=>{e.preventDefault();add($('new-title').value);$('new-title').value='';$('new-title').focus()});
$('nav').addEventListener('click',e=>{let b=e.target.closest('button[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));render()});
$('tasks').addEventListener('change',e=>{let el=e.target.closest('[data-action="toggle"]');if(!el)return;let t=tasks.find(x=>x.id===el.dataset.id);if(t){t.done=el.checked;t.completedAt=t.done?Date.now():null;save();notify(t.done?'Task completed':'Task reopened')}});
$('tasks').addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b)return;let t=tasks.find(x=>x.id===b.dataset.id);if(!t)return;if(b.dataset.action==='delete'){if(confirm('Delete “'+t.title+'”?')){tasks=tasks.filter(x=>x.id!==t.id);save();notify('Task deleted')}}if(b.dataset.action==='edit'){let title=prompt('Edit task title',t.title);if(title!==null&&title.trim()){t.title=title.trim();save()}}if(b.dataset.action==='details'){let p=prompt('Priority: high, medium, or low',t.priority);if(p===null)return;if(!['high','medium','low'].includes(p.toLowerCase())){notify('Use high, medium, or low');return}let d=prompt('Due date (YYYY-MM-DD), or leave blank',t.due||'');if(d===null)return;if(d&&!/^\d{4}-\d{2}-\d{2}$/.test(d)){notify('Use YYYY-MM-DD for due date');return}let tags=prompt('Tags, separated by commas',t.tags.join(', '));if(tags===null)return;t.priority=p.toLowerCase();t.due=d;t.tags=tags.split(',').map(x=>x.trim().replace(/^#/,'')).filter(Boolean).slice(0,8);save();notify('Task updated')}});
$('search').addEventListener('input',render);$('sort').addEventListener('change',render);$('priority-filter').addEventListener('change',render);$('theme').addEventListener('click',()=>{document.body.classList.toggle('dark');localStorage.setItem('tm-theme',document.body.classList.contains('dark')?'dark':'light')});if(localStorage.getItem('tm-theme')==='dark')document.body.classList.add('dark');
$('focus').addEventListener('click',()=>{focusMode=!focusMode;$('focus').textContent=focusMode?'Exit focus':'Focus mode';render()});$('clear-done').addEventListener('click',()=>{let n=tasks.filter(t=>t.done).length;if(n&&confirm('Clear '+n+' completed task(s)?')){tasks=tasks.filter(t=>!t.done);save();notify('Completed tasks cleared')}});
$('save-goals').addEventListener('click',()=>{goals.week=Math.max(1,Math.min(100,Number($('week-goal').value)||5));goals.month=Math.max(1,Math.min(500,Number($('month-goal').value)||20));localStorage.setItem('tm-goals-v1',JSON.stringify(goals));render();notify('Goals saved')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('search').value='';render()}if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('search').focus()}if(e.key.toLowerCase()==='n'&&!e.ctrlKey&&!e.metaKey&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){$('new-title').focus()}});
render();
</script></body></html>
